# Nginx Reverse Proxy for GoDude Admin Panel (admin.godude.lk)
# Blocks direct IP / unknown-Host access while serving admin.godude.lk securely.

# 1. Block all direct IP & unknown Host header requests on HTTP (80)
server {
    listen 80 default_server;
    server_name _;

    # Allow container-local healthcheck ONLY on loopback Host (localhost/127.0.0.1)
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://admin:3100/api/health;
    }

    location / {
        return 444;
    }
}

# 2. Block all direct IP & unknown Host header requests on HTTPS (443)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        return 444;
    }
}

# 3. Allow strictly admin.godude.lk on HTTP (ACME challenge + HTTPS redirect)
server {
    listen 80;
    server_name admin.godude.lk;

    # Allow ACME / Let's Encrypt HTTP-01 verification cleanly on HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/health {
        proxy_pass http://admin:3100/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://admin.godude.lk$request_uri;
        }
        proxy_pass http://admin:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

# 4. Serve strictly admin.godude.lk on HTTPS (443)
server {
    listen 443 ssl;
    http2 on;
    server_name admin.godude.lk;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Restore real visitor IP from Cloudflare headers
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    client_max_body_size 10m;

    location / {
        proxy_pass http://admin:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
