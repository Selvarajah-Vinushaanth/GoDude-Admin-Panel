# Nginx Reverse Proxy for GoDude Admin Panel (admin.godude.lk) behind Cloudflare

server {
    listen 80 default_server;
    server_name admin.godude.lk _;

    # Allow health checks directly on HTTP
    location = /api/health {
        proxy_pass http://admin:3100/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # If Cloudflare terminates TLS via Flexible SSL it sends X-Forwarded-Proto: https;
    # otherwise redirect plain HTTP to HTTPS so Full/Full(Strict) & direct traffic stay encrypted.
    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://admin.godude.lk$request_uri;
        }
        proxy_pass http://admin:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name admin.godude.lk _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Restore real visitor IP from Cloudflare headers
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    client_max_body_size 10m;

    location / {
        proxy_pass http://admin:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
