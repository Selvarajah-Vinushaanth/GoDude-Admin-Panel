services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godude-admin-web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3100"

  nginx:
    image: nginx:1.27-alpine
    container_name: godude-admin-nginx
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
